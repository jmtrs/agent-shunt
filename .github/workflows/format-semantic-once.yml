name: Format semantic branch once

on:
  push:
    branches: [feat/confidence-gated-semantic-recall]
    paths:
      - ".github/workflows/format-semantic-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: feat/confidence-gated-semantic-recall
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Format
        run: cargo fmt
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/application/retrieve.rs
          git commit -m "style: format semantic retrieval tests"
          git push
