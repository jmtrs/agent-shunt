name: Publish v0.13.0 and clean stale branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.13-once.yml

permissions:
  contents: write

jobs:
  release-and-clean:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Verify package version
        run: grep -q '^version = "0.13.0"$' Cargo.toml

      - name: Publish v0.13.0
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: 8acf57af5635e4d81030375d1483c208ea0bc2c2
        run: |
          if gh release view v0.13.0 >/dev/null 2>&1; then
            echo "v0.13.0 already exists; nothing to do."
          else
            cat > /tmp/release-notes.md <<'EOF'
          ## Retrieval correctness, stronger benchmarks, and leaner CI

          v0.13.0 focuses on making retrieval behavior more correct under a fixed context budget, while strengthening the evidence behind the published benchmark claims.

          ### Retrieval

          - Down-ranks project manifests and metadata behind implementation source when both match broad queries, without excluding configuration evidence.
          - Makes MMR budget-aware: candidates that cannot actually be delivered no longer create "ghost redundancy" that suppresses deliverable evidence.
          - Removes the Hono semantic regression without repository-specific heuristics.
          - Keeps semantic recall bounded and confidence-gated.

          ### Reproducible quality

          On the pinned 50-question benchmark across ripgrep, Flask, Hono, Cobra, and Gson with a 1,200-token budget:

          | Strategy | Hit@1 | Hit@3 | Hit@5 | MRR |
          | --- | ---: | ---: | ---: | ---: |
          | lexical | 50% | 76% | 84% | 0.619 |
          | local semantic | 50% | 82% | 90% | 0.662 |
          | rg + window | 26% | 64% | 72% | 0.446 |
          | rg + symbol | 26% | 64% | 72% | 0.445 |

          Lexical retrieval delivers about 1,026 estimated source-context tokens per query. The same selected files read in full require 910,748 tokens across the corpus, a 94.37% aggregate context reduction.

          ### Evaluation and CI

          - Adds same-budget targeted ripgrep navigation baselines.
          - Runs semantic evaluation on retrieval/ranking pull requests.
          - Caches model weights and per-corpus semantic vectors.
          - Runs up to two semantic corpora in parallel.
          - Cancels superseded workflow runs per PR/ref.
          - Generalizes release semantic validation to release/v* and deduplicates release push/PR runs.

          These figures measure estimated source context and retrieval quality, not provider billing tokens, end-to-end LLM cost, or superiority to a full coding agent.

          Full methodology and machine-readable results:
          - https://github.com/jmtrs/agent-shunt/blob/main/eval/RESULTS.md
          - https://github.com/jmtrs/agent-shunt/blob/main/eval/results/2026-09-18-semantic.json
          - https://github.com/jmtrs/agent-shunt/blob/main/eval/results/2026-09-18-targeted-rg.json
          EOF

            gh release create v0.13.0 \
              --target "$RELEASE_TARGET" \
              --title "v0.13.0 - budget-aware retrieval" \
              --notes-file /tmp/release-notes.md
          fi

      - name: Delete stale branches
        run: |
          stale_branches=(
            "debug/hono-ranking"
            "debug/hono-semantic-fusion"
            "eval/targeted-read-baselines"
            "fix/budget-aware-mmr"
            "fix/ci-concurrency"
            "fix/project-metadata-ranking"
            "fix/semantic-mid-fusion"
            "fix/semantic-novel-file-only"
            "fix/semantic-tail-fusion"
            "refactor/retrieval-stages"
            "release/v0.13.0"
          )

          for branch in "${stale_branches[@]}"; do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "$branch already absent"
            fi
          done
