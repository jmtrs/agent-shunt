name: Apply isolated filename boost fix

on:
  push:
    branches:
      - fix/filename-boost-basename
    paths:
      - .github/workflows/apply-filename-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/filename-boost-basename
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Apply exact source and regression-test patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/adapters/ripgrep.rs")
          text = path.read_text()

          old = "        let normalized = path.to_lowercase();"
          new = """        let normalized = Path::new(&path)
              .file_name()
              .and_then(|name| name.to_str())
              .unwrap_or_default()
              .to_ascii_lowercase();"""
          if text.count(old) != 1:
              raise SystemExit(f"expected one filename normalization site, found {text.count(old)}")
          text = text.replace(old, new, 1)

          anchor = """    #[test]
              fn binary_extension_files_are_never_ranked() {"""
          regression = """    #[test]
              fn filename_hits_ignore_parent_directory_names() {
                  let root = tempdir().unwrap();
                  fs::create_dir(root.path().join("matcher")).unwrap();
                  fs::write(root.path().join("matcher/noise.rs"), "const marker: usize = 1;\\n")
                      .unwrap();
                  fs::write(root.path().join("matcher.rs"), "const marker: usize = 1;\\n").unwrap();

                  let hits = super::filename_hits(
                      root.path(),
                      &[super::term_forms("matcher")],
                      &[],
                      100,
                  )
                  .unwrap();

                  assert!(hits.iter().any(|hit| hit.path == "matcher.rs"));
                  assert!(hits.iter().all(|hit| hit.path != "matcher/noise.rs"));
              }

              #[test]
              fn binary_extension_files_are_never_ranked() {"""
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one regression-test anchor, found {text.count(anchor)}")
          text = text.replace(anchor, regression, 1)
          path.write_text(text)

      - name: Format
        run: cargo fmt

      - name: Remove temporary workflow
        run: rm .github/workflows/apply-filename-fix.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/adapters/ripgrep.rs .github/workflows/apply-filename-fix.yml
          git commit -m "fix(retrieval): restrict filename boost to basename"
          git push origin HEAD:fix/filename-boost-basename
