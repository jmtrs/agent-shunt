name: Semantic retrieval evaluation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/semantic-eval.yml"
      - "eval/external/**"
      - "examples/semantic_eval.rs"
      - "src/application/retrieve.rs"
      - "src/application/retrieve/**"
      - "src/adapters/ripgrep.rs"
      - "src/adapters/local_embedding.rs"
  push:
    branches: [release/v0.12.0]
    paths:
      - ".github/workflows/semantic-eval.yml"
      - "examples/semantic_eval.rs"
      - "src/application/retrieve.rs"
      - "src/application/retrieve/**"
      - "src/adapters/ripgrep.rs"
      - "src/adapters/local_embedding.rs"

permissions:
  contents: read

jobs:
  evaluate:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        include:
          - { name: ripgrep, repo: "https://github.com/BurntSushi/ripgrep.git", commit: "3fce3b5bb0236da2df6d99672afb8a719642eca7", corpus: ripgrep }
          - { name: flask, repo: "https://github.com/pallets/flask.git", commit: "d73fa1cdcbd8b1465c151db8924ba58b1dd14e35", corpus: flask }
          - { name: hono, repo: "https://github.com/honojs/hono.git", commit: "098e11912ab244c5c33931de007f04dc8e3c2929", corpus: hono }
          - { name: cobra, repo: "https://github.com/spf13/cobra.git", commit: "adbc8813901bba65827259daa8e22ff94ec1f30e", corpus: cobra }
          - { name: gson, repo: "https://github.com/google/gson.git", commit: "854c8255b625cf1e13c701a83ea9ccb4caaa576a", corpus: gson }

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: semantic-eval-${{ matrix.name }}

      - name: Cache local embedding model
        uses: actions/cache@v4
        with:
          path: .fastembed_cache
          key: semantic-model-bge-small-en-v1.5-v1

      - name: Cache semantic vectors
        uses: actions/cache@v4
        with:
          path: /tmp/agent-shunt-semantic-eval
          key: semantic-${{ matrix.name }}-bge-small-v1-${{ matrix.commit }}

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Checkout pinned target
        run: |
          git clone --filter=blob:none "${{ matrix.repo }}" "$RUNNER_TEMP/target"
          git -C "$RUNNER_TEMP/target" checkout --detach "${{ matrix.commit }}"
          test "$(git -C "$RUNNER_TEMP/target" rev-parse HEAD)" = "${{ matrix.commit }}"

      - name: Compare lexical and semantic retrieval
        run: |
          cargo run --release --features local-embed --example semantic_eval -- \
            "eval/external/${{ matrix.corpus }}.json" \
            --root "$RUNNER_TEMP/target" \
            --json | tee "semantic-${{ matrix.corpus }}.json"

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-eval-${{ matrix.corpus }}
          path: semantic-${{ matrix.corpus }}.json
