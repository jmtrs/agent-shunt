name: Publish v0.11.0

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-v0.11.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Verify package version
        run: grep -q '^version = "0.11.0"$' Cargo.toml

      - name: Publish v0.11.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.11.0 >/dev/null 2>&1; then
            echo "v0.11.0 already exists; nothing to do."
            exit 0
          fi

          cat > /tmp/release-notes.md <<'EOF'
          ## Reproducible retrieval benchmarks and quality hardening

          v0.11.0 turns retrieval quality and context savings into reproducible, pinned benchmarks instead of anecdotal claims.

          ### Highlights

          - Added a 50-question external retrieval corpus across ripgrep (Rust), Flask (Python), Hono (TypeScript), Cobra (Go), and Gson (Java), each pinned to an immutable commit.
          - Added CI quality gates and reproducible evaluators for Hit@K, MRR, token budget, and per-case diagnostics.
          - Added a conservative context-savings benchmark against reading the exact same selected files in full: **94.28% less estimated source context (17.47x)**.
          - Added a disclosed plain `rg` + whole-file baseline. Against `rg` top-5 full-file reads, agent-shunt used **97.87% less estimated source context (46.92x)** while reaching **78% vs 74% File-Hit@5** and **0.611 vs 0.489 file MRR**.
          - Hardened lexical ranking so filenames and parent-directory names are separate signals; a directory match can boost an existing content hit but cannot manufacture one.
          - Added provider-payload privacy regression coverage proving that selected chunks are sent and unselected source markers are not.
          - Clarified trust wording: source references are validated locally, but model-written semantics remain untrusted.
          - Renamed the evaluation metric from Recall@K to Hit@K so the reported metric matches what is actually measured.

          ### Benchmark scope

          The published figures cover 50 human-authored architecture and implementation questions, five pinned repositories, five languages, and a 1,200-token retrieval budget. They measure **estimated source-context tokens**, not provider billing tokens or end-to-end LLM cost.

          Full methodology, per-repository results, caveats, run IDs, and machine-readable data live in [`eval/RESULTS.md`](https://github.com/jmtrs/agent-shunt/blob/main/eval/RESULTS.md) and [`eval/results/2026-09-17.json`](https://github.com/jmtrs/agent-shunt/blob/main/eval/results/2026-09-17.json).
          EOF

          gh release create v0.11.0 \
            --target "$GITHUB_SHA" \
            --title "v0.11.0 - reproducible retrieval benchmarks" \
            --notes-file /tmp/release-notes.md
