[package]
name = "agent-shunt"
version = "0.4.0"
edition = "2024"
description = "Provider-neutral, read-only context worker for coding agents"
license = "MIT"
repository = "https://github.com/jmtrs/agent-shunt"
readme = "README.md"
keywords = ["cli", "context", "retrieval", "llm", "agents"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "agent-shunt"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
libc = "0.2"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1"
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
strip = true
